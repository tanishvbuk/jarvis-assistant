[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Personal push-to-talk voice assistant (built with Claude Code)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.27",          # OpenAI-compatible APIs: Groq chat + Whisper, OpenRouter
    "anthropic>=1.13",       # Claude
    "sounddevice>=0.5",      # microphone and speaker
    "numpy>=2.0",
    "pynput>=1.8",           # push-to-talk key, no admin rights needed
    "pywin32>=306; sys_platform == 'win32'",  # Windows SAPI voices (fallback)
    "piper-tts>=1.8",        # local neural voice (fallback)
    "kokoro-onnx>=0.6",      # local neural voice (default), no PyTorch needed
    "python-dotenv>=1.0",
    "aiohttp>=3.9",          # HUD web server and WebSocket
    "pywebview>=5.0; sys_platform == 'win32'",  # HUD in its own window (Edge WebView2)
    "tzdata",                # time zones on Windows (set JARVIS_TZ in .env)
    "google-api-python-client>=2.100",  # Gmail, Calendar, Sheets (read-only)
    "google-auth-oauthlib>=1.2",         # Google sign-in in the browser
    "openwakeword>=0.6",     # "hey Jarvis" wake word (ONNX; models in models/openwakeword)
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]   # offline speech-to-text fallback
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["persona/*.md", "hud/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
